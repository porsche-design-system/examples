<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Courtyard environment placeholder">
  <defs>
    <linearGradient id="pm-court-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#dfe1e3"/>
    </linearGradient>
    <linearGradient id="pm-court-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39a67"/>
      <stop offset="1" stop-color="#a67f4f"/>
    </linearGradient>
  </defs>
  <!-- sky -->
  <rect width="1600" height="180" fill="#8fbede"/>
  <!-- tree hint -->
  <ellipse cx="1180" cy="150" rx="200" ry="120" fill="#6f8f57"/>
  <ellipse cx="1000" cy="170" rx="140" ry="90" fill="#7d9c63"/>
  <!-- back wall -->
  <rect y="120" width="1600" height="520" fill="url(#pm-court-wall)"/>
  <!-- slat fence -->
  <g fill="#e7e9ea">
    <rect x="360" y="360" width="26" height="280"/>
    <rect x="420" y="360" width="26" height="280"/>
    <rect x="480" y="360" width="26" height="280"/>
    <rect x="540" y="360" width="26" height="280"/>
    <rect x="600" y="360" width="26" height="280"/>
    <rect x="660" y="360" width="26" height="280"/>
    <rect x="720" y="360" width="26" height="280"/>
    <rect x="780" y="360" width="26" height="280"/>
  </g>
  <!-- wooden deck -->
  <rect y="620" width="1600" height="280" fill="url(#pm-court-floor)"/>
  <g stroke="#8f6c42" stroke-width="4" opacity="0.6">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="840" x2="1600" y2="840"/>
  </g>
</svg>
