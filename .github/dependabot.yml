# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope: GitHub Actions only. npm dependency updates are intentionally NOT handled
# here — they run weekly via the Copilot coding agent
# (.github/workflows/weekly-dependency-agent.yml), which follows
# docs/runbooks/dependency-updates-agent.md (syncpack flow, held-back deps, single PR).
# Keeping both would produce competing npm PRs.

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-updates:
        patterns:
          - "*"

