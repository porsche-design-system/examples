name: 'Test (Patterns)'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e-patterns:
    name: 'E2E (Patterns)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Download artifact'
        uses: actions/download-artifact@v5
        with:
          name: build-patterns
          path: ./patterns/dist
      - name: 'E2E'
        run: npm run test:e2e:patterns
        shell: bash
  a11y-patterns:
    name: 'A11y (Patterns)'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Download artifact'
        uses: actions/download-artifact@v5
        with:
          name: build-patterns
          path: ./patterns/dist
      - name: 'A11y'
        run: npm run test:a11y:patterns
        shell: bash
  vrt-patterns:
   name: 'VRT (Patterns)'
   runs-on: ubuntu-latest
   container:
     image: ${{ inputs.image }}
     options: --user 1001
   steps:
     - name: 'Checkout'
       uses: actions/checkout@v5
     - name: 'Install'
       uses: ./.github/actions/install
     - name: 'Download artifact'
       uses: actions/download-artifact@v5
       with:
         name: build-patterns
         path: ./patterns/dist
     - name: 'VRT'
       run: npm run test:vrt:patterns
       shell: bash
     - name: 'VRT Regression'
       if: failure()
       uses: actions/upload-artifact@v4
       with:
         name: regression-vrt-patterns
         path: ./patterns/tests/vrt/test-results
