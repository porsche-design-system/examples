name: 'Deploy'

on:
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    name: 'Examples'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5
        with:
          ref: 'gh-pages'
      - name: 'Clean'
        run: |
          rm -rf "./${{ github.ref_name }}"
        shell: bash
      - name: 'Download artifact "Patterns"'
        uses: actions/download-artifact@v6
        with:
          name: build-patterns
          path: "./${{ github.ref_name }}/patterns/"
      - name: 'Download artifact "Angular"'
        uses: actions/download-artifact@v6
        with:
          name: build-angular
          path: "./${{ github.ref_name }}/angular/"
      - name: 'Download artifact "Astro"'
        uses: actions/download-artifact@v6
        with:
          name: build-astro
          path: "./${{ github.ref_name }}/astro/"
      - name: 'Download artifact "Next.js"'
        uses: actions/download-artifact@v6
        with:
          name: build-next-js
          path: "./${{ github.ref_name }}/next-js/"
      - name: 'Download artifact "React"'
        uses: actions/download-artifact@v6
        with:
          name: build-react
          path: "./${{ github.ref_name }}/react/"
      - name: 'Download artifact "React Router"'
        uses: actions/download-artifact@v6
        with:
          name: build-react-router
          path: "./${{ github.ref_name }}/react-router/"
      - name: 'Download artifact "Vanilla JS"'
        uses: actions/download-artifact@v6
        with:
          name: build-vanilla-js
          path: "./${{ github.ref_name }}/vanilla-js/"
      - name: 'Download artifact "Vue"'
        uses: actions/download-artifact@v6
        with:
          name: build-vue
          path: "./${{ github.ref_name }}/vue/"
      - name: 'Download artifact "Templates"'
        uses: actions/download-artifact@v6
        with:
          name: build-templates
          path: "./${{ github.ref_name }}/templates/"
      - name: 'Deploy'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -m "Automated deployment to GitHub Pages (${{ github.ref_name }}): ${{ github.sha }}" --allow-empty
          git push origin gh-pages --force
        shell: bash
