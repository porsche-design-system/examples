name: 'Build'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string

permissions:
  contents: read

env:
  BRANCH_BASE_PATH: ${{ github.ref_name == 'main' && 'nightly' || github.ref_name }}

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Lint'
        run: npm run lint
  angular:
    name: 'Angular'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/angular
        env:
          ANGULAR_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/angular/"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-angular
          path: ./frameworks/angular/dist/
  astro:
    name: 'Astro'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/astro
        env:
          ASTRO_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/astro"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-astro
          path: ./frameworks/astro/dist/
  next-js:
    name: 'Next.js'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/next-js
        env:
          NEXT_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/next-js"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-next-js
          path: ./frameworks/next-js/dist/
  react:
    name: 'React'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/react
        env:
          REACT_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/react"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-react
          path: ./frameworks/react/dist/
  react-router:
    name: 'React Router'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/react-router
        env:
          REACT_ROUTER_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/react-router/"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-react-router
          path: ./frameworks/react-router/build/client/examples/react-router/
  vanilla-js:
    name: 'Vanilla JS'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/vanilla-js
        env:
          VANILLA_JS_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/vanilla-js"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-vanilla-js
          path: ./frameworks/vanilla-js/dist/
  vue:
    name: 'Vue'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/vue
        env:
          VUE_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/vue"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-vue
          path: ./frameworks/vue/dist/
  patterns:
    name: 'Patterns'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/patterns
        env:
          PATTERNS_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/patterns"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-patterns
          path: ./patterns/dist/
  templates:
    name: 'Templates'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build --workspace=@porsche-design-system/templates
        env:
          TEMPLATES_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/templates"
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: build-templates
          path: ./templates/dist/
