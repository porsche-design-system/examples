name: 'Build'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string
      gh-pages-slug:
        description: 'Deploy target slug (e.g. "nightly", "pr-123", "v4"), used as the base path segment.'
        required: true
        type: string

permissions:
  contents: read

env:
  BRANCH_BASE_PATH: ${{ inputs.gh-pages-slug }}

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run lint
  angular:
    name: 'Angular'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/angular
        env:
          ANGULAR_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/angular/"
      - uses: actions/upload-artifact@v7
        with:
          name: build-angular
          path: ./frameworks/angular/dist/
  astro:
    name: 'Astro'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/astro
        env:
          ASTRO_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/astro"
      - uses: actions/upload-artifact@v7
        with:
          name: build-astro
          path: ./frameworks/astro/dist/
  next-js:
    name: 'Next.js'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/next-js
        env:
          NEXT_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/next-js"
      - uses: actions/upload-artifact@v7
        with:
          name: build-next-js
          path: ./frameworks/next-js/dist/
  pds-ui-testing:
    name: 'PDS UI Testing'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/pds-ui-testing
        env:
          NEXT_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/pds-ui-testing"
      - uses: actions/upload-artifact@v7
        with:
          name: build-pds-ui-testing
          path: ./pages/pds-ui-testing/dist/
  react:
    name: 'React'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/react
        env:
          REACT_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/react"
      - uses: actions/upload-artifact@v7
        with:
          name: build-react
          path: ./frameworks/react/dist/
  react-router:
    name: 'React Router'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/react-router
        env:
          REACT_ROUTER_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/react-router/"
      # React Router prerenders HTML under the basename path (build/client/examples/<branch>/react-router/)
      # but Vite outputs assets at build/client/assets/. Copy assets alongside the prerendered HTML
      # to create a self-contained artifact for deployment.
      - run: |
          PRERENDER_DIR="./frameworks/react-router/build/client/examples/${{ env.BRANCH_BASE_PATH }}/react-router"
          cp -r ./frameworks/react-router/build/client/assets "$PRERENDER_DIR/assets"
          cp ./frameworks/react-router/build/client/favicon.ico "$PRERENDER_DIR/" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: build-react-router
          path: ./frameworks/react-router/build/client/examples/${{ env.BRANCH_BASE_PATH }}/react-router/
  vanilla-js:
    name: 'Vanilla JS'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/vanilla-js
        env:
          VANILLA_JS_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/vanilla-js"
      - uses: actions/upload-artifact@v7
        with:
          name: build-vanilla-js
          path: ./frameworks/vanilla-js/dist/
  vue:
    name: 'Vue'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/vue
        env:
          VUE_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/vue"
      - uses: actions/upload-artifact@v7
        with:
          name: build-vue
          path: ./frameworks/vue/dist/
  patterns:
    name: 'Patterns'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/patterns
        env:
          PATTERNS_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/patterns"
      - uses: actions/upload-artifact@v7
        with:
          name: build-patterns
          path: ./patterns/dist/
  templates:
    name: 'Templates'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - name: 'Install'
        uses: ./.github/actions/install
      - run: npm run build --workspace=@porsche-design-system/templates
        env:
          TEMPLATES_PUBLIC_BASE_PATH: "/examples/${{ env.BRANCH_BASE_PATH }}/templates"
      - uses: actions/upload-artifact@v7
        with:
          name: build-templates
          path: ./templates/dist/
