<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Header (Pattern)"/>
  <title>AI-Tag (Pattern)</title>
</head>

<body>
<main class="grid-template gap-y-fluid-xl pb-fluid-2xl">
  <div class="col-basic grid grid-cols-subgrid gap-y-fluid-md" >
    <p-link-tile class="col-span-full sm:col-span-one-half" href="#" label="Tickets 2026" description="Teaser Headline" compact="true" weight="regular" aspect-ratio="{base: '4/3', xs: '16/9', s: '3/4', m: '1/1'}">
      <p-popover slot="header">
        <p-tag color="background-frosted" theme="dark" icon="ai-spark-filled" slot="button">
          <button type="button" aria-expanded="false">AI-generated</button>
        </p-tag>
        <p-text color="contrast-high">
          This content was generated by artificial intelligence.
        </p-text>
      </p-popover>
      <img src="/assets/chrono-car.webp" alt="Some image description" />
    </p-link-tile>
    <p-link-tile class="col-span-full sm:col-span-one-half" href="#" label="Results" description="Teaser Headline" compact="true" weight="regular" aspect-ratio="{base: '4/3', xs: '16/9', s: '3/4', m: '1/1'}">
      <p-popover slot="header">
        <p-tag color="background-frosted" theme="dark" icon="ai-spark-filled" slot="button">
          <button type="button" aria-expanded="false">AI-modified</button>
        </p-tag>
        <p-text color="contrast-high">
          This content was modified by artificial intelligence.
        </p-text>
      </p-popover>
      <img src="/assets/addon.webp" alt="Some image description" />
    </p-link-tile>
  </div>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
