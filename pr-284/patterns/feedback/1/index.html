  <body>
    <footer class="grid-template gap-y-fluid-xl justify-items-center py-fluid-lg bg-surface">
      <section id="feedback" class="col-extended grid gap-fluid-md max-w-prose" aria-labelledby="feedback-question">
        <p-heading
          id="feedback-question"
          class="focus-visible:outline outline-focus outline-offset-2 rounded-md"
          tag="h2"
          size="md"
          align="center"
          tabindex="-1"
        >
          How satisfied are you with the information shown on this page?
        </p-heading>

        <form id="feedback-form" class="grid gap-fluid-md justify-items-center">
          <div class="w-full grid md:grid-cols-[auto_minmax(320px,1fr)_auto] items-center gap-static-md">
            <p-text
              class="row-2 md:row-auto col-1 md:col-auto justify-self-start"
              size="small"
              align="start"
              color="contrast-medium"
            >
              Very dissatisfied
            </p-text>
            <p-segmented-control
              id="feedback-rating"
              class="row-1 md:row-auto col-span-2 md:col-auto"
              columns="5"
              label="How satisfied are you with the information shown on this page?"
              hide-label="true"
            >
              <p-segmented-control-item value="1">1</p-segmented-control-item>
              <p-segmented-control-item value="2">2</p-segmented-control-item>
              <p-segmented-control-item value="3">3</p-segmented-control-item>
              <p-segmented-control-item value="4">4</p-segmented-control-item>
              <p-segmented-control-item value="5">5</p-segmented-control-item>
            </p-segmented-control>
            <p-text
              class="row-2 md:row-auto col-2 md:col-auto justify-self-end"
              size="small"
              align="end"
              color="contrast-medium"
            >
              Very satisfied
            </p-text>
          </div>
          <p-textarea
            id="feedback-comment"
            class="w-full"
            name="comment"
            label="What two things could we do to make this page better?"
            rows="4"
            hidden
          ></p-textarea>
          <p-button id="feedback-submit" type="button" hidden>Submit feedback</p-button>
        </form>

        <div
          id="feedback-thanks"
          class="grid gap-fluid-md justify-items-center"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <p-heading
            id="feedback-thanks-heading"
            class="focus-visible:outline outline-focus outline-offset-2 rounded-md"
            tag="h2"
            size="md"
            align="center"
            tabindex="-1"
          >
            Thank you for your feedback
          </p-heading>
          <p-text align="center">Your feedback helps us continuously improve our page.</p-text>
          <p-button id="feedback-restart" type="button" variant="secondary" icon="refresh">
            Give new feedback
          </p-button>
        </div>
      </section>

      <div class="col-extended grid gap-fluid-md justify-items-center">
        <p-wordmark href="#"></p-wordmark>
        <p-text size="xs" color="contrast-medium" align="center">&copy; 2026 Dr. Ing. h.c. F. Porsche AG.</p-text>
      </div>
    </footer>
