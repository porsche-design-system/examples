<!doctype html>
<html lang="en" class="scheme-light-dark bg-canvas">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Popover (Pattern)">
    <title>Popover (Pattern)</title>
  </head>

  <body>
    <main class="grid-template">
      <section class="col-wide py-fluid-lg grid gap-fluid-md">
        <p-heading tag="h1" size="xl">Priority navigation</p-heading>
        <p-text>
          Resize the frame &mdash; navigation items that no longer fit collapse into the &ldquo;More&rdquo; popover,
          keeping the bar on a single line.
        </p-text>

        <nav
          class="overflow-hidden -mx-[calc(var(--spacing-static-xs)*2+4px)] px-[calc(var(--spacing-static-xs)*2+4px)]"
          aria-label="Repository"
        >
          <ul
            id="nav-bar"
            class="flex items-center gap-static-md min-h-[3rem] whitespace-nowrap border-b border-contrast-lower *:shrink-0"
          >
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 1</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">
                  Some Item 2
                  <p-tag class="ms-static-xs" variant="secondary" compact="true">43</p-tag>
                </a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 3</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 4</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 5</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 6</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 7</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 8</a>
              </p-link-pure>
            </li>
            <li>
              <p-link-pure class="p-static-xs -m-static-xs" icon="none">
                <a href="#">Some Item 9</a>
              </p-link-pure>
            </li>
            <li id="more-trigger" class="ms-auto" hidden>
              <p-popover
                id="more-popover"
                class="[--p-popover-w:240px] [--p-popover-py:var(--spacing-static-md)] [--p-popover-px:var(--spacing-static-md)]"
              >
                <p-button
                  slot="button"
                  id="more-button"
                  type="button"
                  variant="secondary"
                  compact="true"
                  icon="arrow-head-down"
                  aria="{'aria-expanded': false}"
                >
                  More
                </p-button>
                <ul id="overflow-list" class="grid gap-static-md *:grid"></ul>
              </p-popover>
            </li>
          </ul>
        </nav>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
